[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mzspectral"
version = "0.1.0"
description = "Optimizadores espectrales (Muon y Spectron adaptado a tres factores U·diag(S)·V) para matrices densas y factorizadas, con evidencia preregistrada (MZTrain T22)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Esraderey", email = "msc.framework@gmail.com"},
    {name = "Raul Cruz Acosta", email = "msc.framework@gmail.com"}
]
maintainers = [
    {name = "Esraderey", email = "msc.framework@gmail.com"}
]
keywords = [
    "optimizer", "muon", "spectron", "newton-schulz", "orthogonalization", "low-rank", "svd",
    "factorization", "pytorch", "training", "mztrain"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
include = ["mzspectral*"]
